name: Copiar fotos y PDF a la web nueva

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - run: node scripts/fetch-media.mjs
      - run: du -sh public/media public/assets || true
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add public/media public/assets
          git commit -qm "Fotos y PDF copiados de la web antigua" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 10; done
          gh workflow run pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}
