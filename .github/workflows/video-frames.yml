name: Fotogramas de las películas

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && pip install -q -U yt-dlp
      - run: node scripts/video-frames.mjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add public/img/frames src/data/frames.json
          git commit -qm "Fotogramas de las películas para el avance" || exit 0
          git push origin HEAD:main
          gh workflow run pages.yml --ref main || true
        env:
          GH_TOKEN: ${{ github.token }}
