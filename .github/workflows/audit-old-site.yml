name: Auditoría de la web antigua

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-old-site.mjs
        env:
          SAVE: https://www.deonissafaris.com/caza-en-africa/namibia/namibia-paquete-economico- https://www.deonissafaris.com/pesca
      # El resultado se guarda en la rama audit-data (no dispara el despliegue).
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mv audit-old-site.json /tmp/
          git checkout --orphan audit-data
          git rm -rfq .
          mv /tmp/audit-old-site.json .
          git add audit-old-site.json
          git commit -qm "Resultado de la auditoría"
          git push -f origin audit-data
